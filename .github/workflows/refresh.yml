name: Refresh data
on:
  schedule:
    - cron: "7,37 13-21 * * 1-5"   # prices, about every half hour on US market days (UTC)
    - cron: "20 11 * * *"          # full refresh with quarterly financials, once a day
  workflow_dispatch:
    inputs:
      mode:
        description: "full or prices"
        default: "full"
permissions:
  contents: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull data
        working-directory: model
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" != "20 11 * * *" ]; then
            python3 build_data.py --prices
          elif [ "${{ github.event.inputs.mode }}" = "prices" ]; then
            python3 build_data.py --prices
          else
            python3 build_data.py
          fi
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || git commit -m "data: refresh"
          git push
